interface:
  display_name: "Git Latest Code Check"
  short_description: "Check development targets and verify before pushing"
  default_prompt: "Use $git-latest-code-check for this confirmed Git worktree, preserving user requirements, accepted business rules/design, task scope, progress, and authorization; report every result, announce updates first, revalidate only affected code after updating, and verify the actual existing destination before every authorized push."

policy:
  allow_implicit_invocation: false
